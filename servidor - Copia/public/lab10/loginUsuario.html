<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="carros.css">
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        <div class="nav">
            <a href="/cadastroUsuario">Cadastrar</a>
            <a href="/carros">Ver Carros</a>
        </div>
        <hr>
        <form action="/login" method="POST">
            <label>Login:</label>
            <input type="text" name="login" required>

            <label>Senha:</label>
            <input type="password" name="senha" required>

            <button type="submit">Entrar</button>
        </form>
        <p>Não tem conta? <a href="/cadastroUsuario">Cadastrar</a></p>
    </div>
</body>
</html>
