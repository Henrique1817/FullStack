<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastro</title>
    <link rel="stylesheet" href="/primeiroSemetres/form-auth.css" />
  </head>
  <body class="auth-page">
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>Cadastro de usuário</h1>
        <form action="/cadastra" method="post">
          <label for="nome">Nome</label>
          <input id="nome" name="nome" type="text" required autocomplete="name" />

          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" required autocomplete="email" />

          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" required minlength="4" autocomplete="new-password" />

          <button type="submit">Cadastrar</button>
        </form>
        <p class="auth-links">
          Já tem conta? <a href="/login">Fazer login</a> ·
          <a href="/primeiroSemetres/projects.html">Projetos</a>
        </p>
      </div>
    </div>
  </body>
</html>
